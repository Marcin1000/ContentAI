name: Kontrola źródła

# Pilnuje dwóch rzeczy, których nie widać w code review dużego pliku HTML:
#  1. czy warianty w app/ nadal odpowiadają temu, co wychodzi ze źródła,
#     i czy nie wypadła żadna z poprawek F1-F17 ani element reskinu,
#  2. czy do repo nie trafił prawdziwy klucz API.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  kontrola:
    name: Poprawki, warianty i klucze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Buduje wszystkie trzy warianty ze źródła i sprawdza:
      #  - obecność każdej poprawki F1-F17 oraz elementów reskinu,
      #  - że żadna nie wróciła do stanu sprzed poprawki,
      #  - że każda deklaracja klucza występuje dokładnie raz
      #    (potrójna deklaracja = SyntaxError i martwe UI),
      #  - że pliki app/web-*.html zgadzają się ze źródłem.
      # Kod wyjścia 1 przy jakiejkolwiek niezgodności.
      - name: Poprawki F1-F17, reskin i zgodność wariantów
        run: python3 narzedzia/sprawdz_zrodlo.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Serwer nie ma zależności npm, więc wystarczy kontrola składni i testy
      # haszowania haseł oraz tłumaczenia Anthropic <-> OpenAI.
      - name: Serwer — składnia i testy
        run: |
          node --check serwer/server.js
          node --check serwer/uzytkownicy.js
          node serwer/testy.js

      # Placeholdery w aplikacji ("sk-ant-...", "sk-proj-...") są krótkie,
      # więc wymóg 40+ znaków po prefiksie ich nie łapie. Prawdziwe klucze łapie.
      - name: Brak prawdziwych kluczy API
        run: |
          if grep -rnE 'sk-ant-api03-[A-Za-z0-9_-]{40}|sk-proj-[A-Za-z0-9_-]{40}|sk_[a-f0-9]{48}' . \
               --exclude-dir=.git --exclude-dir=.github; then
            echo "::error::W repozytorium znaleziono coś, co wygląda na prawdziwy klucz API."
            echo "Klucze podaje się w panelu 'Klucze API' (localStorage) albo jako zmienne"
            echo "środowiskowe Cloudflare Workera - nigdy w kodzie."
            exit 1
          fi
          echo "Nie znaleziono prawdziwych kluczy - tylko placeholdery."
