name: Kontrola źródła

# Pilnuje dwóch rzeczy, których nie widać w code review dużego pliku HTML:
#  1. czy warianty w app/ nadal odpowiadają temu, co wychodzi ze źródła,
#     i czy nie wypadła żadna z poprawek F1-F17 ani element reskinu,
#  2. czy do repo nie trafił prawdziwy klucz API.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  kontrola:
    name: Poprawki, warianty i klucze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Buduje wszystkie trzy warianty ze źródła i sprawdza:
      #  - obecność każdej poprawki F1-F17 oraz elementów reskinu,
      #  - że żadna nie wróciła do stanu sprzed poprawki,
      #  - że każda deklaracja klucza występuje dokładnie raz
      #    (potrójna deklaracja = SyntaxError i martwe UI),
      #  - że pliki app/web-*.html zgadzają się ze źródłem.
      # Kod wyjścia 1 przy jakiejkolwiek niezgodności.
      - name: Poprawki F1-F17, reskin i zgodność wariantów
        run: python3 narzedzia/sprawdz_zrodlo.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Serwer nie ma zależności npm, więc wystarczy kontrola składni i testy.
      # Pętla po katalogu, żeby nowy moduł nie wypadł z kontroli przez przeoczenie.
      - name: Serwer - składnia i testy
        run: |
          for plik in serwer/*.js; do node --check "$plik"; done
          node serwer/testy.js
          # Testy tworzą serwer/dane/ (sekret sesji, konta). Katalog jest
          # w .gitignore - sprawdzamy, że nic z niego nie jest wersjonowane.
          if [ -n "$(git ls-files serwer/dane/)" ]; then
            echo "::error::pliki z serwer/dane/ trafiły do repozytorium"
            git ls-files serwer/dane/
            exit 1
          fi

      # ESLint nad JavaScriptem aplikacji. Aplikacja to jeden plik HTML, więc
      # skrypty trzeba najpierw wyciąć - numeracja linii zostaje zachowana.
      # Wąski zestaw reguł: nie styl, tylko klasy błędów, które w pliku z 460
      # funkcjami w zasięgu globalnym milczą aż do awarii u użytkownika.
      # Tak wyszedł na jaw klucz i18n zadeklarowany dwa razy z różnymi
      # tłumaczeniami - poprawka była w źródle i nie działała.
      - name: JavaScript aplikacji - ESLint
        run: |
          npm install --no-save --no-audit --no-fund eslint
          # Wycięte skrypty muszą leżeć WEWNĄTRZ repozytorium: ESLint 9 pomija
          # pliki spoza katalogu bazowego konfiguracji i kończy się zerem,
          # czyli krok przechodziłby nie sprawdzając niczego.
          mkdir -p .eslint-tmp
          for wariant in keys proxy owner; do
            python3 narzedzia/wytnij_skrypty.py "app/web-$wariant.html" ".eslint-tmp/$wariant.js"
          done
          npx eslint .eslint-tmp/keys.js .eslint-tmp/proxy.js .eslint-tmp/owner.js

      # Dwie kontrole, które łapią klasy błędów milczące aż do spotkania
      # z użytkownikiem: brak klucza tłumaczenia (t() po cichu schodzi na polski,
      # więc angielski interfejs pokazuje polskie zdanie) i przycisk wołający
      # nieistniejącą funkcję (w interfejsie po prostu nic się nie dzieje).
      - name: Aplikacja - tłumaczenia i uchwyty zdarzeń
        run: |
          python3 narzedzia/audyt_i18n.py
          python3 narzedzia/audyt_uchwyty.py

      # Strona produktowa ma własne dwa słowniki wpisane wprost w plik i tę
      # samą cichą usterkę: brak klucza nie wywala niczego, tylko angielska
      # wersja pokazuje polskie zdanie.
      - name: Strona produktowa - tłumaczenia
        run: python3 narzedzia/audyt_showcase.py

      # Aplikacja usuwa dlugie myslniki z generowanych artykulow po polsku.
      # Ta kontrola rozciaga te sama regule na interfejs, strone produktowa
      # i dokumentacje, zeby nie wracaly przy kolejnych zmianach.
      - name: Teksty - bez dlugich myslnikow
        run: python3 narzedzia/audyt_myslniki.py

      # Placeholdery w aplikacji ("sk-ant-...", "sk-proj-...") są krótkie,
      # więc wymóg 40+ znaków po prefiksie ich nie łapie. Prawdziwe klucze łapie.
      - name: Brak prawdziwych kluczy API
        run: |
          if grep -rnE 'sk-ant-api03-[A-Za-z0-9_-]{40}|sk-proj-[A-Za-z0-9_-]{40}|sk_[a-f0-9]{48}' . \
               --exclude-dir=.git --exclude-dir=.github; then
            echo "::error::W repozytorium znaleziono coś, co wygląda na prawdziwy klucz API."
            echo "Klucze podaje się w panelu 'Klucze API' (localStorage) albo jako zmienne"
            echo "środowiskowe Cloudflare Workera - nigdy w kodzie."
            exit 1
          fi
          echo "Nie znaleziono prawdziwych kluczy - tylko placeholdery."
